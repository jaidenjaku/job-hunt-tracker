name: Test Setup

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIEVER: ${{ secrets.RECIEVER }}
          FRIEND_EMAIL: ${{ secrets.FRIEND_EMAIL }}
          PORT: ${{ secrets.PORT }}
        run: |
          for var in SMTP_ADDRESS EMAIL_ADDRESS EMAIL_PASSWORD RECIEVER; do
            if [ -z "${!var}" ]; then
              echo "$var secret is not set!"
              exit 1
            else
              echo "$var is configured"
            fi
          done

      - name: Check required files exist
        run: |
          for f in main.py filters.py db.py notifier.py requirements.txt scrapers/driver.py scrapers/saic.py scrapers/leidos.py scrapers/vanguard.py scrapers/boozallen.py scrapers/lockheed.py scrapers/northropgrumman.py scrapers/caci.py; do
            if [ -f "$f" ]; then
              echo "$f found"
            else
              echo "$f not found!"
              exit 1
            fi
          done

      - name: Test Python syntax
        run: |
          python -m py_compile main.py filters.py db.py notifier.py scrapers/driver.py scrapers/saic.py scrapers/leidos.py scrapers/vanguard.py scrapers/boozallen.py scrapers/lockheed.py scrapers/northropgrumman.py scrapers/caci.py
          echo "Python syntax OK"

      - name: Success
        run: echo "All checks passed!"
